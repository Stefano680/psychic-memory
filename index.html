<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff7a2f">
  <title>萌宠搞笑日常 · AI 短视频智能助理</title>
  <script>
    (function(){var t;try{t=localStorage.getItem('wb_petfun_theme')}catch(e){}if(t!=='light'&&t!=='dark')t='dark';var d=document.documentElement;d.setAttribute('data-theme',t);try{var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#080d11':'#ff7a2f')}catch(e){}})();
  </script>
<style>
:root{
  /* 浅色主题（萌趣暖橙，默认） */
  --bg:#f6f4f1; --card:#fffdfb; --panel:#fffdfb; --panel-2:#f7f4f0;
  --ink:#1e1a15; --ink2:#4a4239; --muted:#8a8076;
  --line:#ece5dc; --line2:#f5f0e9; --line3:#e4ddd3;
  --brand:#ff7a2f; --brand2:#ff9a5c; --soft:#fff2e9; --brand-ink:#d4600f;
  --ok:#199c66; --oks:#e8f7f0; --ok-line:#d7ede3;
  --warn:#c98100; --warns:#fdf3e0;
  --err:#e0483c; --errs:#fdecea; --pur:#6f61e8; --purs:#eeecfd;
  --blue:#2f7ae0; --blues:#e9f2fd;
  --mask:rgba(30,26,21,.42); --toast-bg:#251f19; --toast-ink:#fff;
  --r:16px; --r2:12px; --r-sm:10px; --r-pill:999px;
  --sh:0 1px 2px rgba(30,26,21,.04),0 6px 20px rgba(30,26,21,.05);
  --sh-hover:0 12px 32px rgba(30,26,21,.10); --sh-modal:0 20px 60px rgba(30,26,21,.20);
  --ring:0 0 0 3px rgba(255,122,47,.12); --sh-brand:0 6px 16px rgba(255,122,47,.28);
  --w-med:600; --w-bold:700; --w-xb:800;
  --d-fast:.14s; --d-mid:.2s; --d-slow:.35s; --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  /* 深色主题（极光青绿霓虹） */
  --bg:#080d11; --card:rgba(255,255,255,.05); --panel:rgba(255,255,255,.04); --panel-2:rgba(255,255,255,.03);
  --ink:#e8f4f1; --ink2:#9fb4b8; --muted:#6a7e83;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.05); --line3:rgba(255,255,255,.08);
  --brand:#2ee6c8; --brand2:#38bdf8; --soft:rgba(46,230,200,.12); --brand-ink:#19c2a8;
  --ok:#34d399; --oks:rgba(52,211,153,.14); --ok-line:rgba(52,211,153,.30);
  --warn:#fbbf24; --warns:rgba(251,191,36,.14);
  --err:#fb7185; --errs:rgba(251,113,133,.14); --pur:#a78bfa; --purs:rgba(167,139,250,.16);
  --blue:#60a5fa; --blues:rgba(96,165,250,.16);
  --mask:rgba(3,7,9,.62); --toast-bg:rgba(15,26,30,.92); --toast-ink:#e8f4f1;
  --sh:0 4px 24px rgba(0,0,0,.45);
  --sh-hover:0 12px 38px rgba(0,0,0,.55); --sh-modal:0 24px 70px rgba(0,0,0,.65);
  --ring:0 0 0 3px rgba(46,230,200,.30); --sh-brand:0 6px 22px rgba(46,230,200,.38);
}
[data-theme="dark"] body{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 540px at 12% -8%, rgba(46,230,200,.13), transparent 60%),
    radial-gradient(820px 480px at 92% 4%, rgba(56,189,248,.12), transparent 58%),
    radial-gradient(780px 660px at 50% 120%, rgba(46,230,200,.08), transparent 62%);
}
[data-theme="dark"] body::before{
  background-image:radial-gradient(rgba(46,230,200,.09) 1px, transparent 1.4px);
}
[data-theme="dark"] .card,
[data-theme="dark"] .modal,
[data-theme="dark"] .side,
[data-theme="dark"] .sk-scene,
[data-theme="dark"] .scn-card,
[data-theme="dark"] .scn-angle,
[data-theme="dark"] .item,
[data-theme="dark"] .step,
[data-theme="dark"] .shot,
[data-theme="dark"] .pdlg .mk{
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line);
}
[data-theme="dark"] .card:hover{box-shadow:var(--sh-hover),var(--sh-brand);border-color:rgba(46,230,200,.38)}
[data-theme="dark"] .btn.pri:hover{background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--sh-brand)}
[data-theme="dark"] .h1{background-size:220% auto;animation:flow 7s linear infinite}
[data-theme="dark"] .today{background:linear-gradient(150deg,rgba(46,230,200,.10),transparent 72%);border-color:var(--line)}
[data-theme="dark"] .scn-angle.bound{background:var(--soft)}
[data-theme="dark"] .step.done{background:var(--oks);border-color:var(--ok-line)}
[data-theme="dark"] .item.od{background:var(--errs)}
[data-theme="dark"] .sc{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
[data-theme="dark"] .sc.od{background:var(--errs)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 10% -10%, rgba(255,122,47,.10), transparent 60%),
    radial-gradient(820px 480px at 100% 0%, rgba(255,154,92,.10), transparent 55%),
    radial-gradient(760px 640px at 50% 122%, rgba(255,180,120,.07), transparent 60%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(255,122,47,.06) 1px, transparent 1.4px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 78%);
  mask-image:radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 78%);
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line3);border-radius:var(--r-sm)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:216px;flex:0 0 216px;background:var(--card);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand b{font-size:15px;letter-spacing:.2px;display:block;line-height:1.25}
.brand span{font-size:11px;color:var(--muted);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);
  color:var(--ink2);font-size:14px;text-align:left;width:100%;min-height:44px;transition:.14s
}
.nav button:hover{background:var(--line2)}
.nav button.on{background:var(--soft);color:var(--brand);font-weight:600}
.nav button svg{flex:0 0 18px;opacity:.85}
.nav .grp{font-size:11px;color:var(--muted);padding:14px 12px 6px;letter-spacing:.6px;font-weight:600}
.nav .badge{margin-left:auto;background:var(--err);color:#fff;font-size:11px;padding:1px 6px;border-radius:20px;font-weight:700}

.main{flex:1;min-width:0;padding:20px 24px 60px;max-width:1180px}
.topbar{display:none}
.mnav{display:none}

/* ---------- Common ---------- */
.h1{font-size:21px;font-weight:800;margin:0 0 2px;letter-spacing:.2px;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card.tight{padding:13px}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.ch h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.ch h3::before{content:"";width:7px;height:7px;border-radius:var(--r-pill);flex:0 0 auto;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--ring)}
.ch .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 15px;min-height:44px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--ink2);
  transition:border-color var(--d-fast) var(--ease),background var(--d-fast),transform var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease)
}
.btn:hover{border-color:var(--line3);background:var(--panel)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:var(--brand);box-shadow:var(--sh-brand)}
.btn.pri:hover{background:linear-gradient(135deg,#f56d1f,#ff8a4d);box-shadow:var(--sh-brand)}
.btn.gho{background:transparent;border-color:transparent;color:var(--muted)}
.btn.gho:hover{background:var(--line2);color:var(--ink2)}
.btn.sm{min-height:44px;padding:0 11px;font-size:13px;border-radius:var(--r-sm)}
.btn.dan{color:var(--err);border-color:#f3d6d2}
.btn.dan:hover{background:var(--errs)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:0 0 auto}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.o{background:var(--soft);color:var(--brand-ink)}
.tag.g{background:var(--oks);color:var(--ok)}
.tag.r{background:var(--errs);color:var(--err)}
.tag.y{background:var(--warns);color:var(--warn)}
.tag.p{background:var(--purs);color:var(--pur)}
.tag.b{background:var(--blues);color:var(--blue)}

label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 5px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  min-height:44px;outline:none;transition:.14s
}
textarea{min-height:76px;resize:vertical;line-height:1.55;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--card);box-shadow:var(--ring)}
.fld{margin-bottom:12px}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 44px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line3);border-radius:20px;transition:.18s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i:before{transform:translateX(18px)}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---- 萌宠角色 ---- */
.pets{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card.pet{padding:14px;display:flex;flex-direction:column;gap:9px}
.petHead{display:flex;align-items:center;gap:11px}
.petHead .pn2{font-weight:800;font-size:15px;line-height:1.2}
.petHead .psp{font-size:12px;color:var(--muted);margin-top:2px}
.petHead .tag{margin-left:auto;flex:0 0 auto}
.sbar{display:flex;align-items:center;gap:9px;font-size:12px}
.sbar .sl{width:32px;color:var(--muted);flex:0 0 auto;text-align:right}
.sbar .strack{flex:1;height:8px;background:var(--line2);border-radius:var(--r-sm);overflow:hidden}
.sbar .sfill{display:block;height:100%;border-radius:var(--r-sm);transition:width .35s;position:relative;overflow:hidden}
.sbar .sfill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 18%,rgba(255,255,255,.5) 50%,transparent 82%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.sbar .sfill.g{background:var(--ok)}
.sbar .sfill.y{background:var(--warn)}
.sbar .sfill.r{background:var(--err)}
.sbar .sv{width:30px;flex:0 0 auto;text-align:left;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.pstat{font-size:12.5px;color:var(--muted);background:var(--line2);padding:7px 10px;border-radius:var(--r-sm);line-height:1.5}
.pact{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pact .btn{font-size:12px;padding:0 4px;min-height:44px}
.prow{display:flex;gap:8px}
.prow .btn{flex:1}
.pdlg .av{display:flex;justify-content:center;margin:4px 0 14px}
.pdlg h2{margin:0 0 2px;font-size:18px}
.pdlg .pinfo{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:14px}
.pdlg .block{margin:13px 0}
.pdlg .bt{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pdlg .kv{font-size:13px;line-height:1.7;color:var(--ink2)}
.pdlg .chips{display:flex;flex-wrap:wrap;gap:6px}
.pdlg .chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.pdlg .chip.k{background:var(--soft);color:var(--brand-ink)}
.pdlg .chip.tb{background:var(--errs);color:var(--err)}
.pdlg .prom{font-size:12px;line-height:1.65;background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.pdlg .prom .t{font-weight:700;color:var(--brand);display:block;margin-bottom:4px}
/* —— 情景剧工坊选择网格 —— */
.sk-grid{gap:10px}
.skc{cursor:pointer;align-items:center;text-align:center;padding:12px 8px;transition:border-color .15s,box-shadow .15s}
.skc.on{border-color:var(--brand);box-shadow:var(--ring)}
.sk-scenes{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:2px}
.sk-scene{cursor:pointer;padding:12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.sk-scene:hover{border-color:var(--brand2)}
.sk-scene.on{border-color:var(--brand);box-shadow:var(--ring)}
.sk-scene .pn2{font-weight:800;font-size:14.5px}
.sk-scene .psp{font-size:11.5px;color:var(--muted);line-height:1.45}
.sk-scene .tag{margin-top:2px;align-self:flex-start}
.sk-scene .tag.b{background:var(--line2);color:var(--ink2)}
/* —— 场景控制页（SceneCam）专属样式 —— */
.scn-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
@media(max-width:880px){ .scn-wrap{grid-template-columns:1fr} }
.scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.scn-card{cursor:pointer;padding:13px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:border-color .15s,box-shadow .15s,transform .12s}
.scn-card:hover{border-color:var(--brand2)}
.scn-card.on{border-color:var(--brand);box-shadow:var(--ring)}
.scn-card .nm{font-weight:800;font-size:14.5px;color:var(--ink)}
.scn-card .ty{font-size:11px;letter-spacing:.4px;color:var(--muted)}
.scn-card .ev{font-size:11.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scn-card .rd{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.scn-card .rd .tag{font-size:10.5px;padding:2px 8px}
.scn-card.bound{border-left:3px solid var(--brand)}
.scn-filter{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.scn-filter .btn{padding:5px 11px;font-size:12px}
.scn-detail{padding:14px}
.scn-detail .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.scn-detail .hd .ttl{font-weight:800;font-size:18px;color:var(--ink)}
.scn-detail .hd .ty{font-size:12px;color:var(--muted)}
.scn-angles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:560px){ .scn-angles{grid-template-columns:1fr} }
.scn-angle{cursor:pointer;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;gap:4px;transition:border-color .15s,box-shadow .15s;position:relative}
.scn-angle:hover{border-color:var(--brand2)}
.scn-angle.on{border-color:var(--brand);box-shadow:var(--ring)}
.scn-angle.bound{background:var(--soft)}
.scn-angle .rn{display:flex;align-items:center;gap:6px}
.scn-angle .rn .nm{font-weight:700;font-size:13px}
.scn-angle .rn .kd{font-size:10.5px;color:var(--muted);background:var(--line2);padding:1px 6px;border-radius:var(--r-sm)}
.scn-angle .ds{font-size:11.5px;color:var(--ink2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scn-angle .uf{font-size:10.5px;color:var(--muted);margin-top:2px}
.scn-angle .bk{position:absolute;top:6px;right:8px;font-size:10px;background:var(--brand);color:#fff;padding:1px 6px;border-radius:var(--r-sm)}
.scn-angle .df{position:absolute;top:6px;right:8px;font-size:10px;background:var(--line2);color:var(--ink2);padding:1px 6px;border-radius:var(--r-sm)}
.scn-detail .meta{padding:9px 11px;background:var(--line2);border-radius:var(--r-sm);font-size:12px;color:var(--ink2);line-height:1.6;margin-top:8px}
.scn-detail .meta b{color:var(--ink)}
.scn-prom{font-size:12px;line-height:1.65;background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin-top:10px;font-family:var(--mono);max-height:240px;overflow:auto}
.scn-prom .t{font-weight:700;color:var(--brand);font-family:inherit}
.scn-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.scn-tbl th,.scn-tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.scn-tbl th{font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;background:var(--line2)}
.scn-tbl td .nm{font-weight:700;color:var(--ink)}
.scn-tbl td .ag{color:var(--brand2);font-weight:600}
.scn-tbl tr.empty td{text-align:center;color:var(--muted);padding:20px}
/* —— 情景剧片段弹窗：剧本与分镜 —— */
.skdlg .script{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sl-line{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.6}
.sl-line .rl{flex:0 0 96px;font-weight:700;color:var(--brand);text-align:right}
.sl-line .lt{flex:1;color:var(--ink2)}
.shot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:9px 0;background:var(--card)}
.shot .sh-h{font-weight:700;margin-bottom:6px;color:var(--ink)}
.shot .prom{background:var(--soft);border-color:var(--line)}
.pdlg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.pdlg .mk{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px}
.pdlg .mk b{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pdlg .mk span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.pdlg .cu{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pdlg .cu .chip{background:var(--soft);color:#d4600f}

.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13.5px}
.empty svg{opacity:.3;margin-bottom:8px}

/* today */
.today{background:linear-gradient(150deg,#fff6ef,#fffdfb 60%);border:1px solid #ffe0cb}
.tdItem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.tdItem:last-child{border-bottom:none;padding-bottom:0}
.tdItem .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:7px;flex:0 0 9px}
.tdItem.od .dot{background:var(--err)}
.tdItem .bd{flex:1;min-width:0}
.tdItem .t1{font-weight:600;font-size:14.5px}
.tdItem .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.tdItem.od .t1{color:var(--err)}

/* list items */
.item{border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;background:var(--panel);margin-bottom:9px}
.item:last-child{margin-bottom:0}
.item.od{border-color:var(--line);background:var(--errs)}
.item .ti{display:flex;gap:8px;align-items:flex-start}
.item .ti b{font-size:14.5px;font-weight:600;flex:1;min-width:0;line-height:1.45}
.item .mt{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.done{opacity:.58}
.item.done b{text-decoration:line-through}

.cb{width:22px;height:22px;border:2px solid var(--line3);border-radius:var(--r-sm);flex:0 0 22px;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--card);transition:.14s}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb svg{opacity:0}
.cb.on svg{opacity:1}
.cbw{padding:6px;margin:-6px 0 0 -6px;display:flex}

/* prompt block */
.pb{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin-bottom:9px;position:relative}
.pb .pbh{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.pb .pbh b{font-size:12.5px;color:var(--ink2)}
.pb .pbh .sp{flex:1}
.pb p{margin:0;font-size:13.5px;line-height:1.68;color:var(--ink2);word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy{font-size:12px;font-weight:700;color:var(--brand);padding:6px 9px;border-radius:var(--r-sm);background:var(--soft);min-height:32px}
.copy.ok{background:var(--oks);color:var(--ok)}

/* steps */
.step{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:8px;background:var(--panel)}
.step .no{width:26px;height:26px;border-radius:var(--r-sm);background:var(--soft);color:var(--brand);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.step.done{background:var(--oks);border-color:var(--ok-line)}
.step.done .no{background:var(--oks);color:var(--ok)}
.step .sb{flex:1;min-width:0}
.step .sb b{font-size:14px;display:block}
.step .sb p{margin:3px 0 0;font-size:12.8px;color:var(--muted);line-height:1.55}

/* logs */
.log{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:flex-start}
.log:last-child{border:none}
.log .lv{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:var(--r-sm);flex:0 0 auto;margin-top:2px;letter-spacing:.3px}
.log .lv.info{background:var(--blues);color:var(--blue)}
.log .lv.ok{background:var(--oks);color:var(--ok)}
.log .lv.warn{background:var(--warns);color:var(--warn)}
.log .lv.error{background:var(--errs);color:var(--err)}
.log .lb{flex:1;min-width:0}
.log .lb .lm{word-break:break-word}
.log .lb .lt{font-size:11.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}

/* modal */
.mask{position:fixed;inset:0;background:var(--mask);display:none;align-items:center;justify-content:center;z-index:80;padding:16px;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;box-shadow:var(--sh-modal)}
.modal h3{margin:0 0 6px;font-size:17px}
.modal .mp{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-ink);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;opacity:0;transition:.24s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.bar{height:7px;background:var(--line2);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:20px;transition:.4s}

.notice{background:var(--warns);border:1px solid var(--line);color:var(--warn);padding:10px 13px;border-radius:12px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:center}
.notice .sp{flex:1}

details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel);overflow:hidden}
details.acc>summary{padding:12px 13px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .sp{flex:1}
details.acc>summary .ar{transition:.2s}
details.acc[open]>summary .ar{transform:rotate(90deg)}
details.acc .ab{padding:0 13px 13px}

.pipe{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:3px 0 6px;-webkit-overflow-scrolling:touch}
.pipe .pn{flex:0 0 auto;padding:7px 11px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pipe .pn.ok{background:var(--oks);border-color:#cceadb;color:var(--ok)}
.pipe .pn.run{background:var(--soft);border-color:#ffd8bd;color:var(--brand)}
.pipe .pn.err{background:var(--errs);border-color:#f5cfcb;color:var(--err)}
.pipe .ar{color:var(--muted);flex:0 0 auto}
.spin{animation:sp 1s linear infinite;transform-origin:center}
@keyframes sp{to{transform:rotate(360deg)}}

.view{display:none;animation:fi .2s ease}
.view.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
pre.code{background:#2a241e;color:#f2ece4;padding:13px;border-radius:var(--r2);overflow-x:auto;font-size:12.5px;line-height:1.6;margin:0}
pre.code .k{color:#ffb37a}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- 暖橙科技感增强（签名层） ---------- */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 卡片：悬浮上浮 + 顶部发光胶囊光边（签名动作，仅夸张一个轴） */
.card{position:relative}
.card::before{content:"";position:absolute;top:0;left:16px;right:16px;height:2px;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:0;transition:opacity var(--d-mid) var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover);border-color:var(--line3)}
.card:hover::before{opacity:.92}

/* 卡片入场：仅当视图激活时，GPU 友好的 transform/opacity */
.view.on .card{animation:fadeUp var(--d-slow) var(--ease) both}

/* 选择器卡片悬浮微光 */
.skc:hover,.sk-scene:hover,.scn-card:hover,.scn-angle:hover{transform:translateY(-2px);border-color:var(--line3);box-shadow:var(--sh-hover)}

/* 统计数字渐变发光（驾驶舱 KPI） */
.kpi .v{background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* 焦点可达性：键盘聚焦时品牌光环 */
.btn:focus-visible,.nav button:focus-visible,.skc:focus-visible,.scn-card:focus-visible{outline:none;box-shadow:var(--ring)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .sbar .sfill::after,.btn.pri.run{animation:none!important}
  body::before{display:none}
}

/* ---------- 主题切换器（明暗） ---------- */
.theme-toggle{position:fixed;top:14px;right:16px;z-index:90;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);color:var(--ink);cursor:pointer;transition:transform var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease)}
.theme-toggle:hover{transform:translateY(-2px);box-shadow:var(--sh-hover)}
.theme-toggle:active{transform:scale(.94)}
[data-theme="dark"] .theme-toggle{box-shadow:var(--sh),var(--sh-brand)}
.theme-toggle .ic{width:20px;height:20px;display:none}
.theme-toggle .ic-sun{display:block}
.theme-toggle .ic-moon{display:none}
[data-theme="dark"] .theme-toggle .ic-sun{display:none}
[data-theme="dark"] .theme-toggle .ic-moon{display:block}
@keyframes flow{to{background-position:220% center}}

/* ---------- Mobile ---------- */
@media(max-width:900px){
  .side{display:none}
  .main{padding:12px 13px calc(26px + env(safe-area-inset-bottom));max-width:100%}
  .topbar{
    display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:40;
    background:rgba(255,253,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:10px 13px;margin:-12px -13px 12px
  }
  .topbar .lg{width:30px;height:30px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;flex:0 0 30px}
  .topbar b{font-size:14.5px}
  .topbar .sp{flex:1}
  .mnav{
    display:flex;gap:6px;overflow-x:auto;padding:0 13px 10px;margin:0 -13px 12px;
    position:sticky;top:51px;z-index:39;background:rgba(246,244,241,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none
  }
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);min-height:44px;position:relative}
  .mnav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mnav button .badge{position:absolute;top:-2px;right:-2px;background:var(--err);color:#fff;font-size:10px;padding:0 5px;border-radius:20px;font-weight:700;line-height:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2,.g2.keep2{grid-template-columns:repeat(2,1fr)}
  .h1{font-size:19px}
  .kpi .v{font-size:22px}
  .card{padding:14px;border-radius:14px}
  table.tb{font-size:13px}
  .btn{padding:0 13px}
  .modal{border-radius:16px;padding:17px;max-height:90vh}
}
@media(max-width:400px){ .g4.keep2,.g3.keep2,.g2.keep2{grid-template-columns:1fr} }
/* 工程改良（U1 CORS 真相 / U2 离线语料提示） */
.cors-warn{margin:9px 0 2px;padding:10px 12px;border-radius:var(--r2);font-size:12.8px;line-height:1.65;color:var(--brand-ink);background:var(--soft);border:1px solid var(--line)}
.cors-warn b{color:var(--brand)}
.offline-note{margin:0 0 14px;padding:10px 13px;border-radius:var(--r2);font-size:13px;line-height:1.6;color:#5b4a12;background:#fdf6df;border:1px solid #ecd98a}
.offline-note b{color:#8a6d10}
/* 素材库网格 */
.grid.favs{ grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px; margin-top:4px }
.card.fav .mt{ margin:8px 0 0 }
.card.fav pre.code{ margin:8px 0 0; font-size:11.8px; line-height:1.5 }
/* 多平台排期列表 */
.sclist{ display:flex; flex-direction:column; gap:10px; margin-top:4px }
.sc{ border:1px solid var(--line, #ece4d8); border-radius:12px; padding:11px 13px; background:var(--card) }
.sc.done{ opacity:.62; background:#faf8f4 }
.sc.od{ border-color:var(--line); background:var(--errs) }
.scm{ display:flex; align-items:center; gap:8px; font-size:14px }
.scm .sp{ flex:1 }
.sct{ font-size:12.5px; color:var(--muted, #8a8076); margin-top:4px }

/* —— 萌趣签名 & 层级强化（ui-craft-studio） —— */
.app{position:relative}
.app::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58% 48% at 10% -6%, rgba(255,154,92,.10), transparent 60%),
    radial-gradient(46% 38% at 100% 0%, rgba(255,122,47,.07), transparent 55%)}
.side,.main{position:relative;z-index:1}
.card{transition:box-shadow var(--d-fast) var(--ease),transform var(--d-fast) var(--ease),border-color var(--d-fast)}
@media(hover:hover){
  .card:hover{box-shadow:var(--sh-hover);transform:translateY(-2px);border-color:#f0e7dc}
}
.nav button.on{box-shadow:var(--ring)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--sh-brand)}
.btn.pri:hover{background:linear-gradient(135deg,#f56d1f,#ff8a4d);box-shadow:var(--sh-brand)}
.tag{border-radius:var(--r-pill)}
.sw i,.bar i,.nav .badge,.mnav button.on,.pipe .pn.run{border-radius:var(--r-pill)}
.pipe .pn.run{box-shadow:var(--ring)}
.empty svg{width:54px;height:54px}
.empty{opacity:.92}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--brand2),var(--brand))}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题" title="切换明暗主题" onclick="toggleTheme()">
    <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
  <!-- ========== Sidebar (PC) ========== -->
  <aside class="side">
    <div class="brand">
      <div class="lg"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="4" cy="8" r="2"/><path d="M11 10c-3 0-5.5 2.5-5.5 5.5 0 2 1.5 3.5 3.5 3.5h4c2 0 3.5-1.5 3.5-3.5C16.5 12.5 14 10 11 10z"/></svg></div>
      <div><b>萌宠搞笑助理</b><span>AI 短视频流水线 v1.0</span></div>

  <main class="main">
    <!-- ========== Topbar (Mobile) ========== -->
    <div class="topbar">
      <div class="lg"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="4" cy="8" r="2"/><path d="M11 10c-3 0-5.5 2.5-5.5 5.5 0 2 1.5 3.5 3.5 3.5h4c2 0 3.5-1.5 3.5-3.5C16.5 12.5 14 10 11 10z"/></svg></div>
      <b>萌宠搞笑助理</b>
      <div class="sp"></div>
      <button class="btn sm pri" onclick="Pipeline.runAll()" id="mRunBtn">跑流水线</button>
    </div>
    <nav class="mnav" id="navM"></nav>

    <div id="banner"></div>

    <section class="view on" id="v-dash"></section>
    <section class="view" id="v-pets"></section>
    <section class="view" id="v-scene"></section>
    <section class="view" id="v-skit"></section>
    <section class="view" id="v-collect"></section>
    <section class="view" id="v-digest"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-assets"></section>

    <section class="view" id="v-config"></section>

  </main>

<div class="mask" id="mask"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="对话框"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   萌宠搞笑日常 · AI 短视频智能助理系统
   单文件零依赖。架构：Store → Config → Logger → Pipeline(5 stage) → UI
   ============================================================ */
"use strict";

/* ---------- 全局符号速查表（M1/R2：层边界与命名约定显式化） ----------
   层 1 数据层   ：NS / Store / DB / CFG / DEFAULT_CFG / LIMITS / SCHEMA_VERSION —— 持久化与配置（可变）
   层 2 语料层   ：C（物种/桥段/场景/风格/Tutu基底）/ SceneCtl / PetController —— 只读常量与角色·场景控制器
   层 3 流水线层 ：Modules（5 stage）/ Pipeline / runStage / Scheduler —— 纯函数 + 状态机（不碰 DOM）
   层 4 视图层   ：Views.* / Act / Skit / SceneCam —— 只读数据、产出经 esc() 防 XSS 的 HTML 字符串
   层 5 控制器层 ：renderNav / go / renderAll / boot —— 事件接线与首屏渲染
   约定：CFG/State/DB 为模块级可变单例；视图内所有动态文本必须经 esc()；进入属性/内联事件的值经 escAttr()。
*/


/* ---------- 0. 基础工具 ---------- */
//#region 1.数据层 —— 基础工具 / Store / DB / CFG / LIMITS
const NS = 'wb_petfun_';
const SCHEMA_VERSION = 1;   // 数据 schema 版本：写入时打戳，加载时做轻量迁移（见 M2）
const LIMITS = {           // M2/C3：散落魔法数统一收口，调参只改这里
  stageTimeoutMs: 8000,    // 单阶段超时（ms）
  topN: 5,                 // 展示 Top 趋势数量
  simThreshold: 0.58,      // 去重 Jaccard 相似度阈值
  runKeep: 60,             // 运行记录保留条数
  reportKeep: 20,          // 汇总报告保留份数
  schedulerPollMs: 60000   // 调度器轮询间隔（ms）
};
const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr = s => esc(s).split('`').join('&#96;');  // S2：属性/内联事件上下文转义（在 esc 基础上额外转义反引号，防止模板字面量逃逸）
const uid = p => (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const dayOff = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv-SE'); };
const fmtTime = ts => new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtMs = ms => ms<1000 ? Math.round(ms)+'ms' : (ms/1000).toFixed(2)+'s';
const dayDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const pick = (arr,r) => arr[Math.floor(r()*arr.length)];
const pickN = (arr,n,r) => { const c=arr.slice(); const o=[]; while(o.length<n&&c.length) o.push(c.splice(Math.floor(r()*c.length),1)[0]); return o; };
/* 确定性伪随机：同一天同一源产出稳定，跨天自动变化 */
function seedOf(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const Store = {
  _mem: Object.create(null),       // 读穿透缓存：命中内存，避免每次访问都 JSON.parse（P1）
  _dirty: Object.create(null),     // 脏页标记：延迟批量写盘（P1）
  _flushScheduled: false,
  _warned: false,
  get(k,d){
    if(k in this._mem) return this._mem[k];
    let v;
    try{ const raw=localStorage.getItem(NS+k); v = raw==null? d : JSON.parse(raw); }
    catch(e){ v = d; }
    this._mem[k] = v;              // 读后入缓存，后续命中内存
    return v;
  },
  set(k,v){
    this._mem[k] = v;              // 先更新内存：保证同一调用栈内后续读取一致（含直接 DB.x() 读）
    this._dirty[k] = true;         // 标记脏页，延迟落盘
    this._schedule();
    return true;
  },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} delete this._mem[k]; delete this._dirty[k]; },
  /* 写盘节流：把同一调用栈内的多次 set 合并到一次（微任务）落盘，
     避免跑流水线时「每条 set 都全量 JSON.stringify 写盘」阻塞主线程（P1） */
  _schedule(){
    if(this._flushScheduled) return;
    this._flushScheduled = true;
    const self=this;
    const flushOnce=()=>{ self._flushScheduled=false; self.flush(); };
    if(typeof queueMicrotask==='function') queueMicrotask(flushOnce);
    else if(typeof Promise==='function') Promise.resolve().then(flushOnce);
    else flushOnce();
  },
  /* 立即把脏页写盘；返回失败键数（>0 表示存储空间不足）。可主动调用 */
  flush(){
    let fail=0;
    for(const k in this._dirty){
      if(!this._dirty[k]) continue;
      try{ localStorage.setItem(NS+k, JSON.stringify(this._mem[k])); }
      catch(e){ fail++; if(!this._warned){ toast('存储空间不足，请导出备份后清理'); this._warned=true; } }
      this._dirty[k]=false;
    }
    if(!fail) this._warned=false;
    return fail;
  },
  /* 清空内存缓存（导入备份前调用，避免旧键残留）；脏页一并清空 */
  reset(){ this._mem=Object.create(null); this._dirty=Object.create(null); this._flushScheduled=false; this._warned=false; },
  keys(){ return Object.keys(localStorage).filter(k=>k.startsWith(NS)).map(k=>k.slice(NS.length)); }
};

function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(base,patch){
  if(!patch||typeof patch!=='object') return base;
  for(const k in patch){
    const pv = patch[k], bv = base[k];
    /* 数组：若两侧都是「带 id 的对象数组」（如 collect.sources），按 id 对齐合并，
       保留默认新增项（如 src_ec），避免升级后默认项被整体覆盖丢失 */
    if(Array.isArray(pv) && Array.isArray(bv) && pv.length && bv.length &&
       pv[0] && typeof pv[0]==='object' && 'id' in pv[0] &&
       bv[0] && typeof bv[0]==='object' && 'id' in bv[0]){
      const map = {};
      bv.forEach(x=>{ if(x && x.id!=null) map[x.id] = x; });
      pv.forEach(x=>{ if(x && x.id!=null) map[x.id] = deepMerge(map[x.id]||{}, x); });
      base[k] = Object.keys(map).map(id=>map[id]);
    }
    /* 其他数组（标量数组 / 无 id 数组）保持原语义：用 patch 整体覆盖 */
    else if(Array.isArray(pv)) base[k]=pv;
    else if(pv && typeof pv==='object') base[k]=deepMerge(bv && typeof bv==='object'?bv:{}, pv);
    else base[k]=pv;
  }
  return base;
}
function saveCfg(){ CFG.__v = SCHEMA_VERSION; Store.set('config',CFG); }

   「确定性兜底 + 显式告警」，绝不静默随机（R-GAG-LANG 修复）。 */

/* 桥段 → 场景解析（统一入口，供模块③ plan 调用）。
   三层匹配，杜绝"静默错配 / 静默随机"：
   1) 精确：GAG_SCENE[label] 直接命中；
   2) 模糊：忽略空白后做包含匹配（兼容「今天偷吃被抓包了」这类前后缀修饰）；
   3) 未命中：返回基于 label 哈希的确定性兜底场景（同输入同输出、可复现），
      并显式 Logger.warn，绝不静默随机 —— 这是 R-GAG-LANG 的修复核心。
   返回 { id, name, note, matched }。 */
function resolveSceneGag(label){
  const fallback = (lb)=>{
    const keys = Object.keys(SceneCtl.PRESETS);
    const s = String(lb||'x');
    let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
    const id = keys[h % keys.length];
    const nm = SceneCtl.preset(id).name;
    Logger.warn('任务规划', '桥段「'+lb+'」未映射到已知场景，回退确定性场景「'+nm+'」（建议补充桥段→场景词表）', {label:lb});
    return { id, name:nm, note:'未匹配桥段「'+lb+'」，回退确定性场景（已告警）', matched:false };
  };
  if(!label) return fallback('');
  if(GAG_SCENE[label]) return { id:GAG_SCENE[label], name:SceneCtl.preset(GAG_SCENE[label]).name, note:'已匹配桥段', matched:true };
  const norm = String(label).replace(/\s+/g,'');
  for(const key in GAG_SCENE){
    const k = key.replace(/\s+/g,'');
    if(norm && (norm.includes(k) || k.includes(norm)))
      return { id:GAG_SCENE[key], name:SceneCtl.preset(GAG_SCENE[key]).name, note:'已匹配桥段（模糊）', matched:true };
  }
  return fallback(label);
}

  /* 视角控制：每个场景固定 6 个标准视角（首条必为「全景垂直俯视」）。

     让每个场景的「全景俯视」描述都贴合实际取景地，不出现违和词汇。 */
  ANGLE_TEMPLATES:[
    { id:'overhead_topdown', kind:'俯视', name:'全景垂直俯视',
      descTpl:'全景垂直俯视机位，相机正上方垂直向下 90° 拍摄，鸟瞰整个#取景地#，包含地面材质、四周家具、空间纵深与光源阴影分布，主体与#取景地#形成严谨上下对应关系',
      useFor:'全景解说 / 大远景 / 复杂动线全景' },
    { id:'eye_level', kind:'平视', name:'平视',
      descTpl:'平视机位，相机与人眼齐平，正前方水平拍摄，主体居中，背景呈现自然透视压缩，#取景地#的纵深与门窗层次清晰展开',
      useFor:'对话 / 走位 / 关系镜头' },
    { id:'low_angle', kind:'仰视', name:'低位仰视',
      descTpl:'低位仰视机位，相机贴近地面向上仰拍 25-35°，主体站位显得高大立体，#取景地#顶部的灯具 / 天花 / 雨棚成为画面骨架，强化戏剧张力',
      useFor:'登场 / 摆 pose / 滑稽反差' },
    { id:'side_view', kind:'侧视', name:'正侧视',
      descTpl:'正侧视机位，相机与主体呈 90° 侧面平行，主体的正背轮廓与#取景地#的横向陈设同时清晰入画',
      useFor:'走位跟拍 / 错位互动 / 静物对比' },
    { id:'closeup', kind:'特写', name:'中近景特写',
      descTpl:'中近景特写，主体占画面 60% 以上，聚焦表情 / 局部动作，#取景地#退为虚化背景保留可辨的家具轮廓与光源色彩',
      useFor:'表情反应 / 关键动作 / 表情包镜头' },
    { id:'macro', kind:'微距', name:'微距细节特写',
      descTpl:'微距细节特写，超近距浅景深，聚焦肉垫 / 毛发 / 道具表面等 2-3cm 级细节，#取景地#完全虚化为色块与光斑',
      useFor:'细节反应 / 反转铺垫 / 视觉钩子' }
  ],
  /* 首次访问时为每个 PRESET 注入具体化的 angles 数组（确保 desc 贴合场景） */
  _ensureAngles(){
    Object.values(this.PRESETS).forEach(p=>{
      if(Array.isArray(p.angles)&&p.angles.length>=6) return;
      const tag = '#'+p.name+'#';
      p.angles = this.ANGLE_TEMPLATES.map(t=>({
        id:t.id, kind:t.kind, name:t.name, useFor:t.useFor,
        desc: t.descTpl.split('#取景地#').join(tag)
      }));
    });
  },
  /* 取一个命名预设（默认 Tutu 风暖调居家）。
     首次调用会顺手完成 _ensureAngles，保证后续所有角度读取均一致。 */
  preset(name){ this._ensureAngles(); return this.PRESETS[name] || this.PRESETS.cozy_home; },
  /* 场景切换：设定当前激活场景并返回该预设（不修改角色） */
  use(name){ const p=this.preset(name); this._current=name; return p; },
  /* 返回当前激活场景预设（默认 cozy_home） */
  current(){ return this.preset(this._current || 'cozy_home'); },
  /* 查询全部预设列表（供 UI 选择器使用），返回轻量字段避免过大 */
  list(filterType){
    this._ensureAngles();
    return Object.values(this.PRESETS)
      .filter(p=>!filterType || p.type===filterType)
      .map(p=>({
        id:p.id, name:p.name, type:p.type, env:p.env, light:p.light, cam:p.cam,
        mood:p.mood, ratio:p.ratio,
        angleCount:(p.angles||[]).length,
        boundAngleId:this.bindingOf(p.id)
      }));
  },
  /* 查询某场景的全部视角预设（每条含具体化后的 desc + 是否已绑定 + 是否默认） */
  listAngles(sceneId){
    const p = this.preset(sceneId);
    this._ensureAngles();
    const boundId = this.bindingOf(p.id);
    return (p.angles||[]).map(a=>({
      ...a,
      bound: a.id===boundId,
      isDefault: a.id==='overhead_topdown' && !boundId
    }));
  },
  /* 返回某场景「当前生效」的视角：已绑定→绑定的；未绑定→默认 overhead_topdown。
     多次复用同一场景时此返回值保持稳定，确保跨镜头 / 跨天机位不漂移。 */
  currentAngle(sceneId){
    const p = this.preset(sceneId);
    this._ensureAngles();
    const list = p.angles || [];
    const boundId = this.bindingOf(p.id);
    if(boundId){
      const a = list.find(x=>x.id===boundId);
      if(a) return { sceneId:p.id, source:'bound', angle:a };
    }
    const fallback = list.find(x=>x.id==='overhead_topdown') || list[0];
    return { sceneId:p.id, source:'default', angle:fallback };
  },
  /* 临时预览视角（不持久化、仅当前 UI 显示）。返回的 preview 对象可供调用方
     在内存中预览某视角效果，不会写入视角绑定（绑定请用 bindAngle）。 */
  useAngle(sceneId, angleId){
    const p = this.preset(sceneId);
    const a = (p.angles||[]).find(x=>x.id===angleId);
    if(!a) return null;
    return { sceneId:p.id, source:'preview', angle:a };
  },
  /* —— 视角绑定持久化 —— 键 wb_petfun_scene_bindings:{ sceneId: angleId, ... } */
  _bindings(){ return Store.get('scene_bindings',{}); },
  _setBindings(map){ Store.set('scene_bindings', map||{}); },
  /* 查询某场景已绑视角 id（无绑定返回 null） */
  bindingOf(sceneId){ return this._bindings()[sceneId] || null; },
  /* 为某场景绑定一个视角，同时把 _current 切到该场景；重复绑定即覆盖 */
  bindAngle(sceneId, angleId){
    const p = this.preset(sceneId);
    const a = (p.angles||[]).find(x=>x.id===angleId);
    if(!a) return null;
    const map = this._bindings(); map[p.id]=a.id; this._setBindings(map);
    this._current=p.id;
    Logger.ok('scene','已绑定 '+p.name+' → '+a.name, { sceneId:p.id, angleId:a.id });
    return { sceneId:p.id, source:'bound', angle:a };
  },
  /* 解除某场景的视角绑定（恢复为默认 overhead_topdown） */
  clearBinding(sceneId){
    const map=this._bindings();
    if(!(sceneId in map)) return false;
    delete map[sceneId]; this._setBindings(map);
    Logger.info('scene','已解除视角绑定：'+sceneId);
    return true;
  },
  /* 把一组场景信息渲染为 Markdown 结构化块（与角色无关，可独立拼接） */
  render(envText, lightText, camText, opts){
    opts = opts || {};
    const L = ['## 场景与拍摄（Scene Controller）'];
    if(envText)   L.push('- **环境**：'+envText);
    if(lightText) L.push('- **布光**：'+lightText);
    if(camText)   L.push('- **机位**：'+camText);
    if(opts.mood) L.push('- **氛围**：'+opts.mood);
    if(opts.ratio)L.push('- **画幅**：'+opts.ratio);
    if(opts.angle) L.push('- **当前视角**：'+opts.angle.name+'（'+opts.angle.kind+'）— '+opts.angle.desc);
    return L.join('\n');
  },
  /* 导出当前所有绑定快照（用于跨模块协作 / JSON 备份） */
  exportBindings(){
    const map=this._bindings();
    return Object.keys(map).map(sid=>{
      const a=this.currentAngle(sid);
      return { sceneId:sid, angleId:map[sid], angleName:a.angle?a.angle.name:'', source:a.source };
    });
  }
};

     交互     feed / play / groom / rest / pet   → {ok,msg,delta,emo}
     门控     canPerform(gag) → {ok,quality,reason,note}
     响应     react(event) → string|null
     生命周期 onCast(task) / onShoot(ctx) / dailyTick()
     形象     identityPrompt() / negativePrompt() / imagePrompt() / videoPrompt()
     持久化   save() / load()（键：wb_petfun_pet_{id}，实例间完全隔离）
   ------------------------------------------------------------ */
const ACTION_META = {
  feed: {label:'喂食', cd:3, base:{energy:14, mood:5,  affinity:2, groom:0,  fatigue:-2}, icon:'bowl'},
  play: {label:'陪玩', cd:4, base:{energy:-10,mood:12, affinity:4, groom:6,  fatigue:3},  icon:'ball'},
  groom:{label:'打理', cd:8, base:{energy:-4, mood:2,  affinity:3, groom:-55,fatigue:2},  icon:'brush'},
  rest: {label:'休息', cd:6, base:{energy:22, mood:3,  affinity:0, groom:2,  fatigue:-25},icon:'moon'},
  pet:  {label:'撸一撸',cd:2,base:{energy:2,  mood:8,  affinity:5, groom:2,  fatigue:-3}, icon:'hand'}
};

class PetController {
  constructor(profile){
    this.p = profile;
    this.id = profile.id;
    this.key = 'pet_' + profile.id;
    this.b = profile.behaviors || {};
    this.s = this.load();
  }

  /* ---- 持久化：每只宠物独立的 localStorage 键 ---- */
  defaults(){
    return { energy: Math.round(this.p.traits.energyMax*0.8), mood:72, affinity:30, fatigue:8, groom:25,
      streak:0, totalShoots:0, lastShootAt:null, lastTickDate:todayStr(), cd:{}, history:[] };
  }
  load(){ const d=this.defaults(); const v=Store.get(this.key,null); return v? Object.assign(d,v) : d; }
  save(){ Store.set(this.key, this.s); }
  reset(){ this.s = this.defaults(); this.save(); }

  /* ---- 派生指标 ---- */
  get energyPct(){ return Math.round(this.s.energy / this.p.traits.energyMax * 100); }
  /* 上镜状态分：精力+心情+好感为正，疲劳与凌乱为负 */
  get readiness(){
    const t=this.p.traits;
    const v = this.energyPct*0.34 + this.s.mood*0.3 + this.s.affinity*0.14
            + (100-this.s.fatigue)*0.14 + (100-this.s.groom)*0.08;
    return clamp(v * (0.85 + t.acting/100*0.15));
  }
  get statusText(){
    if(this.s.fatigue>70) return '连轴转太久，需要放假';
    if(this.energyPct<25)  return '饿到没力气，先喂饭';
    if(this.s.mood<30)     return '闹脾气中，陪它玩会儿';
    if(this.s.groom>75)    return '毛乱成一团，该打理了';
    if(this.readiness>=80) return '状态绝佳，随时能上镜';
    return '状态平稳';
  }
  /* 表情：驱动 SVG 头像的状态变化 */
  get emotion(){
    if(this.s.fatigue>70 || this.energyPct<25) return 'sleepy';
    if(this.s.mood<30) return 'grumpy';
    if(this.s.mood>=78 && this.readiness>=70) return 'happy';
    return 'normal';
  }

  /* ---- 冷却 ---- */
  cdLeft(act){
    const at=this.s.cd[act]; if(!at) return 0;
    const need=(ACTION_META[act].cd||0)*60000;
    return Math.max(0, need-(Date.now()-at));
  }

  /* ---- 交互动作：统一入口，专属逻辑通过 behaviors 覆写 ---- */
  act(action){
    const meta = ACTION_META[action];
    if(!meta) return {ok:false, msg:'未知动作'};
    const left = this.cdLeft(action);
    if(left>0) return {ok:false, msg:this.p.name+'刚享受过，'+Math.ceil(left/60000)+' 分钟后再来'};

    // 1) 取基础收益
    let r = Object.assign({}, meta.base);
    r.msg = null;
    // 2) 特性加权（体质影响恢复效率）
    if(r.energy>0) r.energy = r.energy * (this.p.traits.recover/12);
    if(action==='groom') r.groom = r.groom * (1 + this.p.traits.groomNeed/200);
    // 3) 专属覆写：先跑通用 any()，再跑该动作的专属实现
    if(typeof this.b.any === 'function') r = this.b.any(this, r) || r;
    if(typeof this.b[action] === 'function') r = this.b[action](this, r) || r;
    // 4) 落库
    const before = {energy:this.s.energy, mood:this.s.mood, affinity:this.s.affinity};
    this.s.energy   = clamp(this.s.energy + (r.energy||0), 0, this.p.traits.energyMax);
    this.s.mood     = clamp(this.s.mood + (r.mood||0));
    this.s.affinity = clamp(this.s.affinity + (r.affinity||0));
    this.s.fatigue  = clamp(this.s.fatigue + (r.fatigue||0));
    this.s.groom    = clamp(this.s.groom + (r.groom||0));
    this.s.cd[action] = Date.now();
    this.pushHistory(meta.label, r.msg);
    this.save();

    return { ok:true, action, label:meta.label,
      msg: r.msg || this.defaultMsg(action),
      delta:{ energy:this.s.energy-before.energy, mood:this.s.mood-before.mood, affinity:this.s.affinity-before.affinity },
      emo:this.emotion };
  }
  defaultMsg(action){
    const n=this.p.name;
    return ({ feed:n+'埋头把饭盆舔得锃亮', play:n+'玩得起劲，尾巴甩成一片虚影',
      groom:n+'被梳理得毛顺溜溜，整只精神了一圈', rest:n+'找了个舒服的角落睡了过去',
      pet:n+'眯起眼睛，喉咙里发出满足的咕噜声' })[action];
  }
  pushHistory(label, msg){
    this.s.history = (this.s.history||[]);
    this.s.history.unshift({ ts:Date.now(), label, msg:msg||'' });
    this.s.history = this.s.history.slice(0,12);
  }

  /* ---- 行为门控：这只宠物现在能不能演这个桥段 ---- */
  canPerform(gagName){
    let res = { ok:true, quality:70, reason:'', note:'' };
    // 形象禁忌（硬约束，不可绕过）
    if((this.p.taboo||[]).includes(gagName)){
      res.ok=false; res.quality=0; res.reason = this.p.tabooReason || '与固定形象设定冲突';
      return this.b.canPerform ? (this.b.canPerform(this, gagName, res)||res) : res;
    }
    // 专精加成
    if((this.p.skills||[]).includes(gagName)){ res.quality = 88; res.note='角色专精桥段'; }
    // 状态门控（软约束，可以演但会掉质量）
    const gag = C.gag.find(g=>g.n===gagName);
    const highEnergy = gag && ['亢奋','紧张','狂喜'].includes(gag.mood);
    if(highEnergy && this.energyPct < 45){
      res.ok=false; res.quality=Math.round(res.quality*0.4);
      res.reason='精力仅 '+this.energyPct+'%，演不出「'+gag.mood+'」的爆发力，先喂食或休息';
    }
    if(this.s.fatigue > 75){ res.ok=false; res.reason='出镜疲劳 '+this.s.fatigue+'%，需要休息'; res.quality=Math.round(res.quality*0.3); }
    if(this.s.mood < 25){ res.ok=false; res.reason='心情只有 '+this.s.mood+'%，完全不配合'; res.quality=Math.round(res.quality*0.4); }
    if(this.s.groom > 80){ res.note=(res.note?res.note+'；':'')+'毛发凌乱，建议先打理再拍特写'; res.quality=Math.round(res.quality*0.85); }
    // 演技特性微调
    res.quality = clamp(res.quality * (0.8 + this.p.traits.acting/100*0.25));
    return this.b.canPerform ? (this.b.canPerform(this, gagName, res)||res) : res;
  }

  /* ---- 事件响应 ---- */
  react(ev){
    if(this.b.react){ const r=this.b.react(this,ev); if(r) return r; }
    const n=this.p.name;
    const map = {
      call:  this.s.affinity>60 ? n+'立刻抬头看向你，尾巴开始加速' : n+'耳朵动了一下，但没打算理你',
      idle:  this.s.mood<40 ? n+'背对着你趴着，明显在闹情绪' : n+'趴在老位置打盹，偶尔睁眼确认你还在',
      cast:  n+'被选中出镜，'+(this.readiness>=75?'状态在线，走位精准':'状态一般，可能要多拍几条'),
      done:  n+'拍完了，正在用眼神索要报酬'
    };
    return map[ev] || (n+'看了你一眼');
  }

  /* ---- 出镜生命周期 ---- */
  onCast(task){
    if(this.b.onCast){ const m=this.b.onCast(this,task); if(m) return m; }
    return this.react('cast');
  }
  onShoot(ctx){
    ctx = ctx||{};
    this.s.energy  = clamp(this.s.energy - 16, 0, this.p.traits.energyMax);
    this.s.fatigue = clamp(this.s.fatigue + Math.round(22 * (100/(this.p.traits.endurance||70))));
    this.s.groom   = clamp(this.s.groom + 10);
    this.s.affinity= clamp(this.s.affinity + 2);
    this.s.totalShoots = (this.s.totalShoots||0) + 1;
    this.s.lastShootAt = Date.now();
    let extra = null;
    if(this.b.onShoot) extra = this.b.onShoot(this, ctx);
    this.pushHistory('出镜', extra || (this.p.name+'完成一条拍摄'));
    this.save();
    return extra || this.react('done');
  }

  /* ---- 每日自然变化（跨天时自动结算，含缺席惩罚） ---- */
  dailyTick(){
    const today = todayStr();
    const last = this.s.lastTickDate || today;
    let days = dayDiff(last, today);
    if(days <= 0) return false;
    days = Math.min(days, 7);
    for(let i=0;i<days;i++){
      let d = { energy:+this.p.traits.recover, mood:-8, affinity:-1, fatigue:-14, groom:+this.p.traits.groomNeed/6 };
      if(this.b.decay) d = this.b.decay(this, d) || d;
      this.s.energy  = clamp(this.s.energy + d.energy, 0, this.p.traits.energyMax);
      this.s.mood    = clamp(this.s.mood + d.mood);
      this.s.affinity= clamp(this.s.affinity + d.affinity);
      this.s.fatigue = clamp(this.s.fatigue + d.fatigue);
      this.s.groom   = clamp(this.s.groom + (d.groom||0));
    }
    this.s.lastTickDate = today;
    this.save();
    return true;
  }

  /* ---- 形象指纹：所有关键词的一致性锚点 ---- */
  /* 角色固有特征块（纯角色，零场景 / 机位 / 布光 / 环境）—— Markdown 结构化 */
  charBlock(){
    const id=this.p.identity, m=id.metrics||{};
    const L=['## 角色固有特征'];
    L.push('- **物种**：'+id.breed);
    L.push('- **体型**：'+id.build);
    L.push('- **毛发与材质**：'+id.coat+(this.p.identity.renderStyle?('；'+this.p.identity.renderStyle):''));
    L.push('- **面部**：'+id.face);
    L.push('- **标志性特征（服饰 / 配饰）**：'+id.mark);
    L.push('- **配色**：主色 '+this.p.color+'，辅色 '+this.p.color2);
    L.push('');
    L.push('## 体型与设定指标');
    L.push('- **肩高**：'+(m.height||'—'));
    L.push('- **体重**：'+(m.weight||'—'));
    L.push('- **体型比例**：'+(m.ratio||'—'));
    L.push('- **年龄设定**：'+(m.age||'—'));
    L.push('- **毛发色**：'+(m.fur||'—'));
    L.push('- **瞳色**：'+(m.eye||'—'));
    L.push('- **耳型**：'+(m.ear||'—'));
    L.push('- **尾型**：'+(m.tail||'—'));
    L.push('- **爪垫**：'+(m.paw||'—'));
    L.push('- **鼻色**：'+(m.nose||'—'));
    return L.join('\n');
  }
  /* 形象锁定核心（精简版角色固有特征，供其它提示词内嵌引用） */
  identityPrompt(){
    const id=this.p.identity;
    return [
      '**物种**：'+id.breed,
      '**体型**：'+id.build,
      '**毛发与材质**：'+id.coat+(this.p.identity.renderStyle?('；'+this.p.identity.renderStyle):''),
      '**面部**：'+id.face,
      '**标志性特征**：'+id.mark,
      '**配色**：主色 '+this.p.color+'，辅色 '+this.p.color2
    ].join('  ');
  }
  negativePrompt(){
    return this.p.negative + '；不要改变已设定的毛色花纹与配饰，不要多余的肢体或面部结构变形；' + C.tutu.negative;
  }
  /* 文生图：角色块（纯固有特征）+ 场景控制器块（独立）—— 二者严格分离，均为 Markdown */
  imagePrompt(gag, sceneBlock, cfg, phase, consistency){
    // C2：委托给共享 PromptBuilder，Tutu 风锚 / 一致性约束只维护一处
    return PromptBuilder.imagePrompt({
      gag, sceneBlock, cfg, phase, consistency,
      charBlock: this.charBlock(),
      charExtra: (this.b && this.b.imageExtra) ? this.b.imageExtra(this) : null,
      negText: this.negativePrompt()
    });
  }
  /* 多视角角色参考表：转身图(①)/形象锁定图(②)严格纯角色零场景；默认出图(③)末端挂独立场景块 */
  refSheetPrompt(){
    const cu=this.p.identity.closeups||[];
    const turn =
      '① **Turnaround 转身图**（正交平视无透视）：同一固定形象依次排列 正面 / 3-4 正侧 / 正侧 / 3-4 背侧 / 背面 五个转身角度，各角度的毛色花纹、体型比例、配饰 100% 一致；'+
      '下方并排 3 种表情特写：平静（自然神态）/ 开心（嘴角上扬、眼弯）/ 困倦（半闭眼、打哈欠）';
    const lock =
      '② **形象锁定图**：单一正面全身站立标准姿态，清晰展示全部标识性配饰与斑纹，作为后续所有出图的一致性基准（形象锚）。【本面板仅含角色固有特征，禁止任何场景 / 机位 / 布光 / 环境】';
    const defHead =
      '③ **默认出图**：该角色标志性放松姿态，呈现默认可出片状态。其场景由下方「场景控制器」独立提供：';
    const p = SceneCtl.preset('cozy_home');
    const cuTxt = cu.length ? ('- **边缘特写小窗**（四角布局，均带比例参照物）：左上「'+cu[0]+'」｜右上「'+cu[1]+'」｜左下「'+cu[2]+'」｜右下「'+cu[3]+'」') : '';
    const L = [];
    L.push('# 角色设定总表（Reference Sheet · 形象一致性基准）');
    L.push('');
    L.push('## 渲染材质（Tutu 风 · 角色相关，非场景）');
    PromptBuilder.tutuStyleLines(C.tutu).forEach(x=>L.push(x));   // C2：Tutu 风锚一处维护
    L.push('');
    L.push('## 角色固有特征（固定形象，不可变）');
    L.push(this.charBlock());
    L.push('');
    L.push('## 三核心面板');
    L.push(turn);
    L.push(lock);
    L.push(defHead);
    L.push(SceneCtl.render(p.env, p.light, p.cam, { mood:p.mood, ratio:CFG.assets.ratio+' 竖屏，主体居中偏下，头顶预留字幕安全区' }));
    L.push('');
    L.push('## 边缘特写小窗');
    L.push(cuTxt);
    L.push('');
    L.push('## 负面约束');
    L.push('- '+this.negativePrompt());
    L.push('');
    L.push('> 配色色板：主色 '+this.p.color+'，辅色 '+this.p.color2+'。背景：默认出图面板为居家场景，转身图 / 形象锁定图为纯色浅暖灰、固定身高标尺、无文字干扰。');
    return L.join('\n');
  }
  /* 图生视频：角色运动锁定 + 显式委托场景给独立 SceneCtl，自身零场景 */
  videoPrompt(gag, cfg, phase, consistency){
    // C2：委托给共享 PromptBuilder，阶段运动 / Tutu 风锚只维护一处
    return PromptBuilder.videoPrompt({
      gag, cfg, phase, consistency,
      species: this.p.species, personaTag: this.p.persona.tag
    });
  }
  /* 完整档案导出 */
  toJSON(){ return { id:this.id, name:this.p.name, species:this.p.species, state:this.s, readiness:this.readiness }; }
}

/* ------------------------------------------------------------
   PetRegistry — 角色注册表：统一管理所有控制器实例
   ------------------------------------------------------------ */
const PetRegistry = {
  _map: null,
  init(){
    this._map = {};
    PETS.forEach(p=>{ this._map[p.id] = new PetController(p); });
    return this;
  },
  all(){ if(!this._map) this.init(); return Object.values(this._map); },
  get(id){ if(!this._map) this.init(); return this._map[id] || null; },
  bySpecies(sp){ return this.all().find(c=>c.p.species===sp) || null; },
  byName(n){ return this.all().find(c=>c.p.name===n) || null; },
  /* 每日结算：跨天时批量更新所有宠物状态 */
  tickAll(){
    let n=0; this.all().forEach(c=>{ if(c.dailyTick()) n++; });
    if(n) Logger.info('角色系统','跨天结算：'+n+' 只萌宠状态已更新（精力恢复、疲劳消退、心情自然衰减）',{});
    return n;
  },
  /* 智能选角：给定桥段，挑出最合适的萌宠
     综合 = 门控质量 × 0.6 + 上镜状态 × 0.4，并对连续出镜做轮换惩罚 */
  castFor(gagName, exclude){
    exclude = exclude||[];
    const cands = this.all()
      .filter(c=>!exclude.includes(c.id))
      .map(c=>{
        const chk = c.canPerform(gagName);
        let score = chk.quality*0.6 + c.readiness*0.4;
        if(!chk.ok) score *= 0.25;
        // 轮换：今天已出镜过的降权，避免一只宠物包揽全部任务
        const shotToday = c.s.lastShootAt && new Date(c.s.lastShootAt).toLocaleDateString('sv-SE')===todayStr();
        if(shotToday) score *= 0.55;
        return { ctl:c, chk, score };
      })
      .sort((a,b)=>b.score-a.score);
    return cands[0] || null;
  },
  /* 全员状态概览 */
  summary(){
    const all=this.all();
    return { total:all.length,
      ready: all.filter(c=>c.readiness>=70).length,
      tired: all.filter(c=>c.s.fatigue>70 || c.energyPct<25).length,
      needCare: all.filter(c=>c.s.mood<30 || c.s.groom>80).length,
      avgReadiness: Math.round(all.reduce((s,c)=>s+c.readiness,0)/all.length) };
  }
};

/* ------------------------------------------------------------
   固定形象的视觉锚点：参数化手绘 SVG 头像
   emo: normal | happy | sleepy | grumpy —— 由控制器状态驱动
   ------------------------------------------------------------ */
function petAvatar(pet, size, emo){
  size = size||96; emo = emo||'normal';
  const a = pet.art, id = 'p'+pet.id+Math.random().toString(36).slice(2,6);
  const S=[];
  S.push('<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" style="display:block">');
  S.push('<defs><clipPath id="c'+id+'"><circle cx="50" cy="50" r="50"/></clipPath>'+
         '<linearGradient id="bg'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a.base2+'"/><stop offset="1" stop-color="'+shade(a.base2,-8)+'"/></linearGradient></defs>');
  S.push('<g clip-path="url(#c'+id+')"><rect width="100" height="100" fill="url(#bg'+id+')"/></g>');

  // 耳朵（先画，位于头部之下）
  const ear=a.ear;
  if(ear==='cat'){
    S.push('<path d="M22 42 L20 16 L42 30 Z" fill="'+a.base+'"/><path d="M25.5 38 L24.5 24 L37 33 Z" fill="'+tint(a.base,'#ffb9c4',0.5)+'"/>');
    S.push('<path d="M78 42 L80 16 L58 30 Z" fill="'+a.base+'"/><path d="M74.5 38 L75.5 24 L63 33 Z" fill="'+tint(a.base,'#ffb9c4',0.5)+'"/>');
  } else if(ear==='tri-up'){
    S.push('<path d="M20 44 L18 12 L44 28 Z" fill="'+shade(a.base,-10)+'"/><path d="M24 40 L23 21 L38 31 Z" fill="'+tint(a.base,'#ffc0c8',0.45)+'"/>');
    S.push('<path d="M80 44 L82 12 L56 28 Z" fill="'+shade(a.base,-10)+'"/><path d="M76 40 L77 21 L62 31 Z" fill="'+tint(a.base,'#ffc0c8',0.45)+'"/>');
  } else if(ear==='drop'){
    S.push('<path d="M20 34 Q8 44 12 66 Q16 80 28 74 Q22 56 26 40 Z" fill="'+shade(a.base,-14)+'"/>');
    S.push('<path d="M80 34 Q92 44 88 66 Q84 80 72 74 Q78 56 74 40 Z" fill="'+shade(a.base,-14)+'"/>');

/* 颜色工具：明暗调整与混色 */
function shade(hex,p){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(r+p*2.55,0,255); g=clamp(g+p*2.55,0,255); b=clamp(b+p*2.55,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function tint(hex,to,t){
  const a=parseInt(hex.slice(1),16), b=parseInt(to.slice(1),16);
  const r=Math.round(((a>>16)&255)*(1-t)+((b>>16)&255)*t);
  const g=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t);
  const c=Math.round((a&255)*(1-t)+(b&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+c).toString(16).slice(1);
}

/* ============================================================
   5. Pipeline 引擎：阶段化执行 + 重试 + 耗时统计 + 日志
   ------------------------------------------------------------
   每个 stage 都是纯函数 async (input, cfg) => output
   runStage 统一负责：计时、异常捕获、指数退避重试、日志落库
   ============================================================ */
const STAGES = [
  {key:'collect', name:'热点采集'},
  {key:'digest',  name:'内容汇总'},
  {key:'plan',    name:'任务推荐'},
  {key:'assets',  name:'素材生成'},
  {key:'flow',    name:'流程编排'}
];
const State = { view:'dash', running:false, stageState:{}, lastRun:Store.get('lastRun',null) };

async function runStage(key, fn, input){
  const st = STAGES.find(s=>s.key===key);
  const cfg = CFG[key] || {};
  const max = (cfg.retry && cfg.retry.max) || 0;
  const backoff = (cfg.retry && cfg.retry.backoffMs) || 400;
  let attempt = 0;
  const t0 = performance.now();
  State.stageState[key]='run'; renderPipeBar();
  while(true){
    attempt++;
    const ta = performance.now();
    try{
      const out = await fn(input, cfg);
      const cost = performance.now()-ta;
      State.stageState[key]='ok'; renderPipeBar();
      Logger.ok(st.name, '执行成功'+(attempt>1?('（重试第 '+(attempt-1)+' 次后成功）'):''), {durationMs:cost, attempt});
      return out;
    }catch(err){
      const cost = performance.now()-ta;
      if(attempt > max){
        State.stageState[key]='err'; renderPipeBar();
        Logger.error(st.name, '执行失败（已重试 '+max+' 次）：'+(err&&err.message||err), {durationMs:performance.now()-t0, attempt});
        throw err;
      }
      Logger.warn(st.name, '第 '+attempt+' 次尝试失败：'+(err&&err.message||err)+'，'+(backoff*attempt)+'ms 后重试', {durationMs:cost, attempt});
      await sleep(backoff*attempt);
    }
  }
}

const Pipeline = {
  async runAll(silent){
    if(State.running){ toast('流水线正在运行中'); return; }
    State.running = true;
    STAGES.forEach(s=>State.stageState[s.key]='wait');
    renderPipeBar(); updateRunBtn();
    const t0 = performance.now();
    const runRec = { id:uid('run'), date:todayStr(), startAt:Date.now(), trigger: silent?'schedule':'manual', stages:[], status:'running' };
    Logger.info('调度器', (silent?'定时触发':'手动触发')+'流水线运行', {});
    try{
      const today = todayStr();
      // 容错兜底：每个阶段若执行失败，且当日存在上一次成功产物（DB 缓存），则使用该缓存继续下游，
      // 避免「单点失败导致全链路中断、已产出数据全部丢弃」。仅当连缓存都没有时才真正中断。
      const cache = {
        collect: () => DB.raw().filter(r=>r.date===today),
        digest:  () => DB.latestDigest() || null,
        plan:    () => DB.tasks().filter(t=>t.date===today),
        assets:  () => DB.assets().filter(a=>a.date===today),
        flow:    () => DB.flows().filter(f=>f.date===today)
      };
      const ctx = {}; let degraded = false;
      const feed = async (key, fn, input) => {
        try { return await runStage(key, fn, input); }
        catch(e){
          const c = cache[key]();
          const ok = c && (Array.isArray(c) ? c.length : true);
          if(ok){ degraded = true; Logger.warn('流水线', key+' 阶段执行失败，使用上次缓存产物继续（'+(Array.isArray(c)?c.length:1)+' 条）。错误：'+(e.message||e), {error:String(e.message||e)}); return c; }
          throw e;
        }
      };
      ctx.collect = await feed('collect', Modules.collect, null);
      ctx.digest  = await feed('digest',  Modules.digest,  ctx.collect);
      ctx.plan    = await feed('plan',    Modules.plan,    ctx.digest);
      ctx.assets  = await feed('assets',  Modules.assets,  ctx.plan);
      ctx.flow    = await feed('flow',    Modules.flow,    ctx.plan);
      runRec.status='success'; runRec.degraded=degraded;
      runRec.summary = { raw:ctx.collect.length, clusters:ctx.digest.clusters.length, tasks:ctx.plan.length, assets:ctx.assets.length, flows:ctx.flow.length };
      const cost = performance.now()-t0;
      runRec.costMs = cost; runRec.endAt = Date.now();
      Logger.ok('流水线', '全链路完成（'+(degraded?'降级·部分阶段使用缓存':'全新鲜')+'）：采集 '+ctx.collect.length+' 条 → 聚类 '+ctx.digest.clusters.length+' 组 → 任务 '+ctx.plan.length+' 个 → 素材包 '+ctx.assets.length+' 份 → 流程 '+ctx.flow.length+' 套', {durationMs:cost});
      State.lastRun = { at:Date.now(), date:today, status:'success', costMs:cost, degraded };
      Store.set('lastRun', State.lastRun);
      if(!silent) toast('流水线执行完成'+(degraded?'（部分阶段使用了缓存）':''));
    }catch(err){
      runRec.status='failed'; runRec.error=String(err&&err.message||err); runRec.costMs=performance.now()-t0; runRec.endAt=Date.now();
      State.lastRun = { at:Date.now(), date:todayStr(), status:'failed', costMs:runRec.costMs, error:runRec.error };
      Store.set('lastRun', State.lastRun);
      if(!silent) toast('流水线中断：'+runRec.error);
    }finally{
      const runs = DB.runs(); runs.unshift(runRec); DB.setRuns(runs.slice(0, LIMITS.runKeep));
      State.running = false; updateRunBtn(); renderAll();
      Store.flush();   // P1：流水线结束主动落盘，确保本轮产物落地
    }
  },
  async runOne(key){
    if(State.running){ toast('流水线正在运行中'); return; }
    State.running = true; State.manualTrigger = true; updateRunBtn();
    try{
      if(key==='collect'){ await runStage('collect', Modules.collect, null); }
      else if(key==='digest'){ const raw=DB.raw().filter(r=>r.date===todayStr()); if(!raw.length) throw new Error('今日暂无采集数据，请先执行采集'); await runStage('digest', Modules.digest, raw); }
      else if(key==='plan'){ const d=DB.latestDigest(); if(!d) throw new Error('暂无汇总报告，请先执行汇总'); await runStage('plan', Modules.plan, d); }
      else if(key==='assets'){ const t=DB.tasks().filter(x=>x.date===todayStr()); if(!t.length) throw new Error('今日暂无任务，请先生成任务'); await runStage('assets', Modules.assets, t); }
      else if(key==='flow'){ const t=DB.tasks().filter(x=>x.date===todayStr()); if(!t.length) throw new Error('今日暂无任务，请先生成任务'); await runStage('flow', Modules.flow, t); }
      toast('模块执行完成');
    }catch(e){ toast('执行失败：'+(e.message||e)); }
    finally{ State.running=false; State.manualTrigger=false; updateRunBtn(); renderAll(); }
  }
};
