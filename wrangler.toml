name = "petfun-workbench"
compatibility_date = "2024-09-23"

# Cloudflare Pages 项目配置（用 `wrangler pages deploy petfun-pages` 部署）。
# 注意：wrangler.toml 放在 petfun-pages/ 之外或之内均可；本文件供参考，
# 真正部署时工作目录指向 petfun-pages/（含 index.html 与 functions/）。

[pages]
directory = "."

# Pages Functions 调用 Workers AI 需要绑定；变量名必须叫 AI（前端代码与环境变量一致）。
[[pages.bindings]]
type = "ai"
name = "AI"
